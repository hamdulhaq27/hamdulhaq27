<svg xmlns="http://www.w3.org/2000/svg" width="840" height="452" viewBox="0 0 840 452" role="img" aria-labelledby="title desc"><title id="title">Engineering process: six stages</title><desc id="desc">01 Understand: Find the real problem, the users, the data and the constraints. → 02 Architect: Design the system, data flow and integration points. → 03 Build: Develop the backend, automation and AI layer. → 04 Integrate: Connect models, tools, APIs, databases and services. → 05 Test &amp; optimize: Validate reliability, performance and practical usability. → 06 Deploy: Ship a maintainable, working solution — then watch it run.</desc><style>@font-face{font-family:'HM400';src:url(data:font/woff2;base64,) format('woff2');}.m400{font-family:'HM400',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400;}@font-face{font-family:'HM500';src:url(data:font/woff2;base64,) format('woff2');}.m500{font-family:'HM500',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500;}@font-face{font-family:'HI400';src:url(data:font/woff2;base64,) format('woff2');}.s400{font-family:'HI400',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400;font-feature-settings:'cv05' 1;}</style><defs><marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8 5 1 8.5" fill="none" stroke="#3B82F6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="839" height="451" rx="14" fill="#0B0E14" stroke="#232C38" stroke-width="1" /><text x="32" y="42" class="m500" font-size="11" fill="#3B82F6" letter-spacing="2.2" >WORKFLOW</text><text x="808" y="42" class="m400" font-size="11" fill="#4A5466" text-anchor="end" letter-spacing="0.6" >6 stages · iterative</text><line x1="32" y1="60.5" x2="808" y2="60.5" stroke="#232C38" stroke-width="1" /><path d="M167 118H389" fill="none" stroke="#232C38" stroke-width="1.6" marker-end="url(#pa)"/><path d="M447 118H669" fill="none" stroke="#232C38" stroke-width="1.6" marker-end="url(#pa)"/><path d="M727 118H796Q808 118 808 130V238Q808 250 796 250H152Q140 250 140 262V283" fill="none" stroke="#232C38" stroke-width="1.6" marker-end="url(#pa)"/><path d="M167 314H389" fill="none" stroke="#232C38" stroke-width="1.6" marker-end="url(#pa)"/><path d="M447 314H669" fill="none" stroke="#232C38" stroke-width="1.6" marker-end="url(#pa)"/><circle r="3.2" fill="#38BDD8"><animateMotion dur="10s" repeatCount="indefinite" path="M140 118H796Q808 118 808 130V238Q808 250 796 250H152Q140 250 140 262V314H700"/></circle><circle cx="140" cy="118" r="27" fill="#131922" stroke="#3B82F6" stroke-width="1.8"/><text x="140" y="124" class="m500" font-size="16" fill="#3B82F6" text-anchor="middle" >01</text><text x="140" y="171" class="m500" font-size="12.5" fill="#E6EAF0" text-anchor="middle" letter-spacing="1.8" >UNDERSTAND</text><text x="140" y="194" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >Find the real problem, the users,</text><text x="140" y="213" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >the data and the constraints.</text><circle cx="420" cy="118" r="27" fill="#131922" stroke="#3B82F6" stroke-width="1.8"/><text x="420" y="124" class="m500" font-size="16" fill="#3B82F6" text-anchor="middle" >02</text><text x="420" y="171" class="m500" font-size="12.5" fill="#E6EAF0" text-anchor="middle" letter-spacing="1.8" >ARCHITECT</text><text x="420" y="194" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >Design the system, data flow and</text><text x="420" y="213" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >integration points.</text><circle cx="700" cy="118" r="27" fill="#131922" stroke="#3B82F6" stroke-width="1.8"/><text x="700" y="124" class="m500" font-size="16" fill="#3B82F6" text-anchor="middle" >03</text><text x="700" y="171" class="m500" font-size="12.5" fill="#E6EAF0" text-anchor="middle" letter-spacing="1.8" >BUILD</text><text x="700" y="194" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >Develop the backend,</text><text x="700" y="213" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >automation and AI layer.</text><circle cx="140" cy="314" r="27" fill="#131922" stroke="#3B82F6" stroke-width="1.8"/><text x="140" y="320" class="m500" font-size="16" fill="#3B82F6" text-anchor="middle" >04</text><text x="140" y="367" class="m500" font-size="12.5" fill="#E6EAF0" text-anchor="middle" letter-spacing="1.8" >INTEGRATE</text><text x="140" y="390" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >Connect models, tools, APIs,</text><text x="140" y="409" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >databases and services.</text><circle cx="420" cy="314" r="27" fill="#131922" stroke="#3B82F6" stroke-width="1.8"/><text x="420" y="320" class="m500" font-size="16" fill="#3B82F6" text-anchor="middle" >05</text><text x="420" y="367" class="m500" font-size="12.5" fill="#E6EAF0" text-anchor="middle" letter-spacing="1.8" >TEST &amp; OPTIMIZE</text><text x="420" y="390" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >Validate reliability, performance</text><text x="420" y="409" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >and practical usability.</text><circle cx="700" cy="314" r="27" fill="#131922" stroke="#3B82F6" stroke-width="1.8"/><text x="700" y="320" class="m500" font-size="16" fill="#3B82F6" text-anchor="middle" >06</text><text x="700" y="367" class="m500" font-size="12.5" fill="#E6EAF0" text-anchor="middle" letter-spacing="1.8" >DEPLOY</text><text x="700" y="390" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >Ship a maintainable, working</text><text x="700" y="409" class="s400" font-size="13.5" fill="#8A94A6" text-anchor="middle" >solution — then watch it run.</text></svg>