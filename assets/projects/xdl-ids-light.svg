<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="title desc"><title id="title">XDL-IDS CNN-Attention-GRU — model illustration</title><desc id="desc">Illustration: CAN bus frames (ID, DATA_0–DATA_7) flow through Conv1D, multi-head self-attention, GRU and dense layers to classify normal traffic or DoS/spoofing attacks. Reported results: 100% binary accuracy on CICIoV2024; ~93–94% binary and ~75% multiclass on the merged CICIoV2024 + Car Hacking dataset.</desc><style>@font-face{font-family:'HM400';src:url(data:font/woff2;base64,) format('woff2');}.m400{font-family:'HM400',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400;}@font-face{font-family:'HM500';src:url(data:font/woff2;base64,) format('woff2');}.m500{font-family:'HM500',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500;}@font-face{font-family:'HI600';src:url(data:font/woff2;base64,) format('woff2');}.s600{font-family:'HI600',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600;font-feature-settings:'cv05' 1;}</style><defs><marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8 5 1 8.5" fill="none" stroke="#566173" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="pb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8 5 1 8.5" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="839" height="399" rx="14" fill="#F7F9FC" stroke="#D8DFE9" stroke-width="1" /><text x="28" y="36" class="m500" font-size="10.5" fill="#2563EB" letter-spacing="2" >ILLUSTRATION</text><text x="135.6" y="36" class="m500" font-size="10.5" fill="#566173" letter-spacing="2" >·  MODEL ARCHITECTURE</text><text x="812" y="36" class="m400" font-size="10.5" fill="#9AA4B